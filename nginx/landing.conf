# Landing — abooking.org (apex)
server {
    listen 80;
    listen [::]:80;
    server_name abooking.org;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name abooking.org;

    ssl_certificate /etc/letsencrypt/live/abooking.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abooking.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/abooking.org;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
