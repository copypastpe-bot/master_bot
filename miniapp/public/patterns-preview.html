<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master patterns — preview</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    background: #f5f7fa;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #1f2937;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.intro { font-size: 13px; color: #6b7280; margin: 0 0 18px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .card {
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 2px 6px rgba(0,0,0,.05);
  }
  .card h3 {
    margin: 0;
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 700;
    background: #ffffff;
    border-bottom: 1px solid #f3f4f6;
  }
  .tile-wrap {
    position: relative;
    height: 320px;
    background: #ffffff;
  }
  .tile-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background-color: #3390ec;
    -webkit-mask-repeat: repeat;
            mask-repeat: repeat;
    -webkit-mask-size: 260px 260px;
            mask-size: 260px 260px;
    opacity: 0.10;
  }
  .nails::after    { -webkit-mask-image: url('/patterns/nails.svg');    mask-image: url('/patterns/nails.svg');    }
  .barber::after   { -webkit-mask-image: url('/patterns/barber.svg');   mask-image: url('/patterns/barber.svg');   }
  .pets::after     { -webkit-mask-image: url('/patterns/pets.svg');     mask-image: url('/patterns/pets.svg');     }
  .photo::after    { -webkit-mask-image: url('/patterns/photo.svg');    mask-image: url('/patterns/photo.svg');    }
  .garden::after   { -webkit-mask-image: url('/patterns/garden.svg');   mask-image: url('/patterns/garden.svg');   }
</style>
</head>
<body>
<h1>Master patterns preview</h1>
<p class="intro">Каждый паттерн рендерится так же, как появится в мастер-приложении: accent-color через CSS mask, opacity 0.10, тайл 260×260.</p>
<div class="grid">
  <div class="card"><h3>nails — Маникюр и бьюти</h3><div class="tile-wrap nails"></div></div>
  <div class="card"><h3>barber — Парикмахер и барбер</h3><div class="tile-wrap barber"></div></div>
  <div class="card"><h3>pets — Груминг и животные</h3><div class="tile-wrap pets"></div></div>
  <div class="card"><h3>photo — Фотограф и видеограф</h3><div class="tile-wrap photo"></div></div>
  <div class="card"><h3>garden — Садовник</h3><div class="tile-wrap garden"></div></div>
</div>
</body>
</html>
