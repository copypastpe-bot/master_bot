<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Inter', -apple-system, system-ui, sans-serif; }
.og {
  width: 1200px;
  height: 630px;
  background: linear-gradient(135deg, #0f1923 0%, #1a2a3a 50%, #0f1923 100%);
  display: flex;
  align-items: center;
  padding: 0 80px;
  position: relative;
  overflow: hidden;
}
.og::before {
  content: '';
  position: absolute;
  top: -40%;
  right: -10%;
  width: 700px;
  height: 700px;
  background: radial-gradient(circle, rgba(51,144,236,.2) 0%, transparent 70%);
  pointer-events: none;
}
.og::after {
  content: '';
  position: absolute;
  bottom: -30%;
  left: -5%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(79,156,249,.1) 0%, transparent 70%);
  pointer-events: none;
}
.content {
  flex: 1;
  z-index: 1;
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 32px;
}
.logo img {
  height: 44px;
  filter: brightness(0) invert(1);
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 999px;
  background: rgba(51,144,236,.12);
  border: 1px solid rgba(51,144,236,.3);
  color: #72adff;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 24px;
}
h1 {
  font-size: 56px;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.1;
  letter-spacing: -0.03em;
  margin-bottom: 20px;
}
h1 span {
  background: linear-gradient(90deg, #4f9cf9, #79b4ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.sub {
  font-size: 22px;
  color: rgba(255,255,255,.65);
  line-height: 1.5;
  max-width: 520px;
}
.phone-wrap {
  position: relative;
  z-index: 1;
  margin-left: 40px;
}
.phone {
  width: 240px;
  height: 490px;
  border-radius: 36px;
  border: 4px solid rgba(255,255,255,.15);
  overflow: hidden;
  background: #000;
  box-shadow: 0 30px 80px rgba(0,0,0,.5), 0 0 0 1px rgba(255,255,255,.05) inset;
  transform: rotate(3deg);
  position: relative;
}
.phone-notch {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 90px;
  height: 26px;
  background: #000;
  border-radius: 0 0 18px 18px;
  z-index: 10;
}
.phone-screen {
  position: absolute;
  inset: 4px;
  border-radius: 32px;
  overflow: hidden;
}
.phone-screen img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top;
}
.domain {
  position: absolute;
  bottom: 32px;
  right: 80px;
  font-size: 18px;
  font-weight: 600;
  color: rgba(255,255,255,.35);
  z-index: 1;
  letter-spacing: .02em;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="og">
  <div class="content">
    <div class="logo">
      <img src="public/uploads/abooking-logo.png" alt="">
    </div>
    <div class="badge">Telegram Mini App</div>
    <h1>CRM for Freelance<br>Professionals <span>in Telegram</span></h1>
    <p class="sub">Client booking, reminders, loyalty program, broadcasts and reports — all in one place</p>
  </div>
  <div class="phone-wrap">
    <div class="phone">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <img src="public/uploads/mp2maeto-IMG_2699.PNG" alt="">
      </div>
    </div>
  </div>
  <div class="domain">abooking.org</div>
</div>
</body>
</html>
