name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest

    env:
      BONUS_MEDIA_DIR: /tmp/master_bot_test/bonus_media
      AVATARS_DIR: /tmp/master_bot_test/avatars
      PORTFOLIO_DIR: /tmp/master_bot_test/portfolio
      PROMO_MEDIA_DIR: /tmp/master_bot_test/promo_media
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile-check all Python sources
        run: python -m compileall -q src tests main.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
